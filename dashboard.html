// โ”€โ”€ Date helpers โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€
function toThaiDate(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d)) return '';
  const thTime = new Date(d.getTime() + (7 * 60 * 60 * 1000));
  const y = thTime.getUTCFullYear();
  const m = String(thTime.getUTCMonth() + 1).padStart(2, '0');
  const day = String(thTime.getUTCDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}
function todayThai() {
  const thTime = new Date(Date.now() + (7 * 60 * 60 * 1000));
  const y = thTime.getUTCFullYear();
  const m = String(thTime.getUTCMonth() + 1).padStart(2, '0');
  const day = String(thTime.getUTCDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}
function displayDate(s) {
  if (!s) return '';
  const mo = ['เธก.เธ.','เธ.เธ.','เธกเธต.เธ.','เน€เธก.เธข.','เธ.เธ.','เธกเธด.เธข.','เธ.เธ.','เธช.เธ.','เธ.เธข.','เธ•.เธ.','เธ.เธข.','เธ.เธ.'];
  const [y, m, d] = s.split('-');
  return parseInt(d) + ' ' + mo[parseInt(m)-1] + ' ' + (parseInt(y)+543);
}
function displayTime(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d)) return '';
  return d.toLocaleTimeString('th-TH', { timeZone:'Asia/Bangkok', hour:'2-digit', minute:'2-digit' });
}
function itemTime(item) {
  // เธ”เธถเธเน€เธงเธฅเธฒเธฃเธญเธเธเธฒเธ "เธฃเธญเธ HH:MM" โ€” fallback เธชเธณเธซเธฃเธฑเธเธเธฃเธ“เธตเนเธกเนเธกเธต timestamp
  const m = (item || '').match(/เธฃเธญเธ\s*(\d{2}:\d{2})/);
  return m ? m[1] : 'โ€”';
}
function tsTime(ts) {
  if (!ts) return 'โ€”';
  const s = String(ts);
  // ISO string (เธกเธต T เนเธฅเธฐ Z/+) โ’ เนเธเน displayTime เน€เธเธทเนเธญเนเธเธฅเธ timezone Bangkok เนเธซเนเธ–เธนเธเธ•เนเธญเธ
  if (s.includes('T') && (s.endsWith('Z') || s.includes('+'))) {
    return displayTime(s) || 'โ€”';
  }
  // format "DD/MM/YYYY HH:MM:SS" เธเธฒเธ toLocaleString en-GB
  const m = s.match(/(\d{2}:\d{2})(?::\d{2})?/);
  if (m) return m[1];
  return 'โ€”';
}

function renderZoneChart(badRows, allRows) {
  const cnt = {};
  badRows.forEach(r=>{ if(r[C.location]) cnt[r[C.location]]=(cnt[r[C.location]]||0)+1; });
  const sorted = Object.entries(cnt).sort((a,b)=>b[1]-a[1]);

  if (!sorted.length) {
    document.getElementById('chartZone').closest('.chart-wrap').innerHTML='<div class="msg">เนเธกเนเธเธเธเนเธญเธกเธนเธฅเธเธฑเธเธซเธฒ</div>';
    return;
  }
  charts.zone = new Chart(document.getElementById('chartZone').getContext('2d'), {

// โ”€โ”€ Round completion: guard ร— round (เธฃเธธเธเธฅเนเธณ) โ”€โ”€
function renderRoundCompletionEnc(rows, el) {
  const encRows = rows.filter(r => r[C.section] === '1. เธ•เธฃเธงเธเธฃเธธเธเธฅเนเธณ');
  const rounds  = KNOWN_ROUNDS;
  const guards  = [...new Set(encRows.map(r => r[C.guard]).filter(Boolean))].sort();

  if (!guards.length) { el.innerHTML = '<div class="msg">เนเธกเนเธกเธตเธเนเธญเธกเธนเธฅ</div>'; return; }

  const guardRounds = {};
  encRows.forEach(r => {
    const g = r[C.guard]; const t = itemTime(r[C.item]);
    if (!g || t === 'โ€”') return;
    if (!guardRounds[g]) guardRounds[g] = new Set();
    guardRounds[g].add(t);
  });

  let html = `<div class="heatmap-wrap"><table class="round-table">
    <thead><tr><th style="text-align:left">เธฃเธเธ .</th>${rounds.map(t=>`<th>${t}</th>`).join('')}<th>เธฃเธงเธก</th></tr></thead>
    <tbody>`;

  guards.forEach(guard => {
    const done = guardRounds[guard] || new Set();
    const count = rounds.filter(t => done.has(t)).length;
    const pct = Math.round(count / rounds.length * 100);
    const tagCls = pct === 100 ? 'tag-green' : pct >= 50 ? 'tag-amber' : 'tag-red';
    html += `<tr><td class="guard-name">${guard}</td>`;
    rounds.forEach(t => {
      html += `<td><div class="round-cell ${done.has(t) ? 'done' : 'miss'}">${done.has(t) ? 'โ“' : ''}</div></td>`;
    });
    html += `<td><span class="tag ${tagCls}">${count}/${rounds.length}</span></td></tr>`;
  });

  html += '</tbody></table></div>';
  el.innerHTML = html;
}

// โ”€โ”€ Guard table โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€
function renderGuardTable(rows){
  const stats={};
  rows.forEach(r=>{
    const g=(r[C.guard]||'').trim(); if(!g) return;
    if(!stats[g]) stats[g]={name:g,total:0,dates:new Set(),problems:0,rows:[]};
    stats[g].total++; stats[g].rows.push(r);
    if(r._d) stats[g].dates.add(r._d);
    if(isProblem(r)) stats[g].problems++;
  });
  const sorted=Object.values(stats).sort((a,b)=>b.total-a.total);
  const el=document.getElementById('tblGuard');
  if(!sorted.length){ el.innerHTML='<div class="msg">เนเธกเนเธกเธตเธเนเธญเธกเธนเธฅ</div>'; return; }
  el.innerHTML=`<table>
    <thead><tr><th>เธเธทเนเธญเธเธนเนเธ•เธฃเธงเธ</th><th>เธฃเธฒเธขเธเธฒเธฃเธ•เธฃเธงเธ</th><th>เธงเธฑเธเธ—เธตเนเธ•เธฃเธงเธ</th><th>เธเธเธเธฑเธเธซเธฒ</th></tr></thead>
    <tbody>${sorted.map((v,i)=>`<tr class="clickable" onclick="showGuardDetail(${i})">
      <td>${v.name}</td>
      <td>${v.total} เธฃเธฒเธขเธเธฒเธฃ</td>
      <td><span class="tag tag-green">${v.dates.size} เธงเธฑเธ</span></td>
      <td><span class="tag ${v.problems>0?'tag-red':'tag-gray'}">${v.problems}</span></td>
    </tr>`).join('')}</tbody>
  </table>`;
  window._guardData=sorted;
}
function showGuardDetail(idx){
  const v=window._guardData[idx]; if(!v) return;
  openModal(v.name, `เธ•เธฃเธงเธ ${v.total} เธฃเธฒเธขเธเธฒเธฃ / ${v.dates.size} เธงเธฑเธ`,
    v.rows.sort((a,b)=>(a[C.date]||'').localeCompare(b[C.date]||'')));
}

loadData();
</script>
