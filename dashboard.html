<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard ตรวจตลาด</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
    }
    .header {
      background: #fff;
      border-bottom: 1px solid #e5e5ea;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-title { font-size: 17px; font-weight: 700; color: #1d1d1f; }
    .header-sub { font-size: 12px; color: #86868b; margin-top: 2px; }
    .refresh-btn {
      padding: 8px 16px;
      background: #00b4b4;
      color: #fff;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      font-weight: 600;
    }
    .refresh-btn:active { opacity: 0.8; }
    .filter-bar {
      background: #fff;
      border-bottom: 1px solid #e5e5ea;
      padding: 10px 20px;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-group { display: flex; align-items: center; gap: 8px; }
    .filter-group label { font-size: 13px; color: #86868b; white-space: nowrap; }
    .filter-group select {
      padding: 6px 10px;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      color: #1d1d1f;
      background: #fff;
      cursor: pointer;
    }
    .main { padding: 16px; max-width: 900px; margin: 0 auto; }

    /* KPI Cards */
    .kpi-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
    .kpi-card {
      background: #fff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.07);
    }
    .kpi-label { font-size: 12px; color: #86868b; margin-bottom: 4px; }
    .kpi-value { font-size: 30px; font-weight: 700; color: #1d1d1f; line-height: 1; }
    .kpi-sub { font-size: 12px; color: #86868b; margin-top: 4px; }
    .kpi-card.danger .kpi-value { color: #ff3b30; }
    .kpi-card.teal .kpi-value { color: #00b4b4; }

    /* Section Cards */
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 1px 3px rgba(0,0,0,.07);
    }
    .card-title { font-size: 14px; font-weight: 700; color: #1d1d1f; margin-bottom: 14px; }
    .chart-wrap { position: relative; height: 220px; }

    /* Tables */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left;
      padding: 7px 10px;
      background: #f5f5f7;
      color: #86868b;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    td { padding: 9px 10px; border-bottom: 1px solid #f5f5f7; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-red { background: #fff0ef; color: #ff3b30; }
    .badge-orange { background: #fff8f0; color: #ff9500; }
    .badge-green { background: #f0fff4; color: #34c759; }
    .badge-gray { background: #f5f5f7; color: #86868b; }
    .badge-teal { background: #e6fafa; color: #00b4b4; }

    .empty-msg {
      text-align: center;
      padding: 30px 20px;
      color: #86868b;
      font-size: 13px;
    }
    .loading-msg {
      text-align: center;
      padding: 60px 20px;
      color: #86868b;
      font-size: 15px;
    }
    .error-card {
      background: #fff0ef;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      color: #ff3b30;
      font-size: 14px;
      line-height: 1.6;
    }
    .error-card small { color: #86868b; font-size: 12px; }
  </style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">📊 Dashboard ตรวจตลาด</div>
    <div class="header-sub" id="lastUpdate">กำลังโหลด...</div>
  </div>
  <button class="refresh-btn" onclick="loadData()">↻ รีเฟรช</button>
</div>

<div class="filter-bar">
  <div class="filter-group">
    <label>วันที่:</label>
    <select id="dateFilter" onchange="render()">
      <option value="">ทั้งหมด</option>
    </select>
  </div>
  <div class="filter-group">
    <label>หัวข้อ:</label>
    <select id="sectionFilter" onchange="render()">
      <option value="">ทั้งหมด</option>
      <option value="1. ตรวจรุกล้ำ">1. ตรวจรุกล้ำ</option>
      <option value="2. ตรวจความสะอาด">2. ตรวจความสะอาด</option>
      <option value="3. ตรวจบัตรสมาชิก">3. ตรวจบัตรสมาชิก</option>
    </select>
  </div>
</div>

<div class="main" id="main">
  <div class="loading-msg">⏳ กำลังโหลดข้อมูล...</div>
</div>

<script>
// ============================================================
// CONFIG — ใส่ URL เดียวกับแอปตรวจ (Apps Script Web App URL)
// ============================================================
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3N1gxp9Gf94x-dXNbqgzUpirfQuy44YO6-rgcnS_OTVdAzp5Nw10cigkCcoy_uNlu/exec";

let allRows = [];
let charts = {};

// ============================================================
// โหลดข้อมูล
// ============================================================
async function loadData() {
  document.getElementById("main").innerHTML = '<div class="loading-msg">⏳ กำลังโหลดข้อมูล...</div>';
  try {
    const res = await fetch(SCRIPT_URL + "?action=data");
    const json = await res.json();
    allRows = (json.rows || []).filter(r => r && r.date);

    // เติม date filter
    const dates = [...new Set(allRows.map(r => r.date))].filter(Boolean).sort().reverse();
    const sel = document.getElementById("dateFilter");
    sel.innerHTML = '<option value="">ทั้งหมด</option>';
    dates.forEach(d => {
      const opt = document.createElement("option");
      opt.value = d;
      opt.textContent = d;
      sel.appendChild(opt);
    });

    document.getElementById("lastUpdate").textContent =
      "อัปเดตล่าสุด " + new Date().toLocaleTimeString("th-TH", {timeZone:"Asia/Bangkok", hour:"2-digit", minute:"2-digit"});
    render();
  } catch(err) {
    document.getElementById("main").innerHTML =
      `<div class="error-card">
        ⚠️ โหลดข้อมูลไม่ได้<br>
        ตรวจสอบว่าได้อัปเดต Apps Script (doGet) และ Deploy ใหม่แล้ว<br>
        <small>${err.message}</small>
      </div>`;
  }
}

// ============================================================
// กรองข้อมูล
// ============================================================
function getFiltered() {
  const date = document.getElementById("dateFilter").value;
  const section = document.getElementById("sectionFilter").value;
  return allRows.filter(r => {
    if (date && r.date !== date) return false;
    if (section && r.section !== section) return false;
    return true;
  });
}

// ============================================================
// Render ทั้งหมด
// ============================================================
function render() {
  Object.values(charts).forEach(c => { try { c.destroy(); } catch(e){} });
  charts = {};

  const rows = getFiltered();
  const encRows = rows.filter(r => r.section === "1. ตรวจรุกล้ำ");
  const badRows = encRows.filter(r => r.status === "พบการรุกล้ำ");
  const allGuards = new Set(rows.map(r => r.guardName).filter(Boolean));
  const allDates = new Set(rows.map(r => r.date).filter(Boolean));

  // หาโซนที่แย่สุด
  const zoneCounts = {};
  badRows.forEach(r => { if(r.location) zoneCounts[r.location] = (zoneCounts[r.location]||0)+1; });
  const worstZone = Object.entries(zoneCounts).sort((a,b)=>b[1]-a[1])[0];

  document.getElementById("main").innerHTML = `
    <div class="kpi-row">
      <div class="kpi-card danger">
        <div class="kpi-label">พบการรุกล้ำ</div>
        <div class="kpi-value">${badRows.length}</div>
        <div class="kpi-sub">รายการ</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">ตรวจแล้ว (รุกล้ำ)</div>
        <div class="kpi-value">${encRows.length}</div>
        <div class="kpi-sub">รอบ</div>
      </div>
      <div class="kpi-card teal">
        <div class="kpi-label">โซนที่มีปัญหามากสุด</div>
        <div class="kpi-value" style="font-size:14px;padding-top:6px">${worstZone ? worstZone[0] : "-"}</div>
        <div class="kpi-sub">${worstZone ? worstZone[1]+" ครั้ง" : ""}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">จำนวนผู้ตรวจ</div>
        <div class="kpi-value">${allGuards.size}</div>
        <div class="kpi-sub">คน ใน ${allDates.size} วัน</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🚨 จำนวนรุกล้ำแต่ละโซน</div>
      <div class="chart-wrap"><canvas id="chartZone"></canvas></div>
    </div>

    <div class="card">
      <div class="card-title">📈 แนวโน้มรายวัน (พบรุกล้ำ)</div>
      <div class="chart-wrap"><canvas id="chartTrend"></canvas></div>
    </div>

    <div class="card">
      <div class="card-title">🔁 ร้านค้า/จุดที่พบซ้ำซาก</div>
      <div class="tbl-wrap" id="tableRepeat"></div>
    </div>

    <div class="card">
      <div class="card-title">👮 สถิติการตรวจของผู้ตรวจ</div>
      <div class="tbl-wrap" id="tableGuard"></div>
    </div>
  `;

  renderZoneChart(badRows);
  renderTrendChart(badRows);
  renderRepeatTable(badRows);
  renderGuardTable(rows);
}

// ============================================================
// กราฟ: รุกล้ำแต่ละโซน
// ============================================================
function renderZoneChart(badRows) {
  const counts = {};
  badRows.forEach(r => { if(r.location) counts[r.location] = (counts[r.location]||0)+1; });
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);

  if (sorted.length === 0) {
    document.querySelector(".chart-wrap").innerHTML = '<div class="empty-msg">ไม่พบข้อมูลรุกล้ำในช่วงที่เลือก</div>';
    return;
  }

  const ctx = document.getElementById("chartZone").getContext("2d");
  charts.zone = new Chart(ctx, {
    type: "bar",
    data: {
      labels: sorted.map(e => e[0]),
      datasets: [{
        data: sorted.map(e => e[1]),
        backgroundColor: sorted.map((_, i) => i === 0 ? "#ff3b30" : "#00b4b4cc"),
        borderRadius: 6,
        borderSkipped: false
      }]
    },
    options: {
      indexAxis: "y",
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: {
        label: ctx => ` ${ctx.parsed.x} ครั้ง`
      }}},
      scales: {
        x: { ticks: { stepSize: 1, font: {size:12} }, grid: { color: "#f5f5f7" } },
        y: { ticks: { font: { size: 11 } }, grid: { display: false } }
      }
    }
  });
}

// ============================================================
// กราฟ: แนวโน้มรายวัน
// ============================================================
function renderTrendChart(badRows) {
  const counts = {};
  badRows.forEach(r => { if(r.date) counts[r.date] = (counts[r.date]||0)+1; });
  const sorted = Object.entries(counts).sort((a,b) => a[0].localeCompare(b[0]));

  if (sorted.length === 0) return;

  const ctx = document.getElementById("chartTrend").getContext("2d");
  charts.trend = new Chart(ctx, {
    type: "line",
    data: {
      labels: sorted.map(e => e[0]),
      datasets: [{
        label: "พบรุกล้ำ",
        data: sorted.map(e => e[1]),
        borderColor: "#ff3b30",
        backgroundColor: "rgba(255,59,48,0.08)",
        tension: 0.35,
        fill: true,
        pointRadius: 5,
        pointBackgroundColor: "#ff3b30",
        pointBorderColor: "#fff",
        pointBorderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: {
        label: ctx => ` ${ctx.parsed.y} ครั้ง`
      }}},
      scales: {
        y: { beginAtZero: true, ticks: { stepSize: 1, font:{size:12} }, grid: { color: "#f5f5f7" } },
        x: { ticks: { font:{size:11} }, grid: { display: false } }
      }
    }
  });
}

// ============================================================
// ตาราง: ร้านค้าซ้ำซาก (กลุ่มตาม location + note)
// ============================================================
function renderRepeatTable(badRows) {
  const map = {};
  badRows.forEach(r => {
    const note = (r.note || "").trim();
    if (!note) return;
    const key = r.location + "||" + note;
    if (!map[key]) map[key] = { location: r.location, note, dates: new Set(), encTypes: new Set() };
    if (r.date) map[key].dates.add(r.date);
    if (r.encType) map[key].encTypes.add(r.encType);
  });

  const sorted = Object.values(map).sort((a,b) => b.dates.size - a.dates.size);
  const el = document.getElementById("tableRepeat");

  if (sorted.length === 0) {
    el.innerHTML = '<div class="empty-msg">ไม่มีข้อมูล — กรอกหมายเหตุ (ชื่อร้าน/หมายเลขแผง) ในแอปตรวจเพื่อติดตามซ้ำ</div>';
    return;
  }

  el.innerHTML = `<table>
    <tr>
      <th>โซน</th>
      <th>หมายเหตุ / ร้านค้า</th>
      <th>ประเภทรุกล้ำ</th>
      <th>พบ</th>
    </tr>
    ${sorted.map(v => `<tr>
      <td style="font-size:12px;color:#86868b">${v.location}</td>
      <td>${v.note}</td>
      <td style="font-size:11px;color:#86868b">${[...v.encTypes].join("<br>") || "-"}</td>
      <td>
        <span class="badge ${v.dates.size >= 3 ? 'badge-red' : v.dates.size >= 2 ? 'badge-orange' : 'badge-gray'}">
          ${v.dates.size} วัน
        </span>
      </td>
    </tr>`).join("")}
  </table>`;
}

// ============================================================
// ตาราง: สถิติผู้ตรวจ
// ============================================================
function renderGuardTable(rows) {
  const stats = {};
  rows.forEach(r => {
    const g = (r.guardName || "").trim();
    if (!g) return;
    if (!stats[g]) stats[g] = { name: g, total: 0, dates: new Set(), problems: 0 };
    stats[g].total++;
    if (r.date) stats[g].dates.add(r.date);
    if (["พบการรุกล้ำ","ไม่ผ่าน","ผิดปกติ"].includes(r.status)) stats[g].problems++;
  });

  const sorted = Object.values(stats).sort((a,b) => b.total - a.total);
  const el = document.getElementById("tableGuard");

  if (sorted.length === 0) {
    el.innerHTML = '<div class="empty-msg">ไม่มีข้อมูล</div>';
    return;
  }

  el.innerHTML = `<table>
    <tr>
      <th>ชื่อผู้ตรวจ</th>
      <th>รายการตรวจ</th>
      <th>วันที่ตรวจ</th>
      <th>พบปัญหา</th>
    </tr>
    ${sorted.map(v => `<tr>
      <td><strong>${v.name}</strong></td>
      <td>${v.total} รายการ</td>
      <td>
        <span class="badge badge-teal">${v.dates.size} วัน</span>
      </td>
      <td>
        <span class="badge ${v.problems > 0 ? 'badge-red' : 'badge-green'}">${v.problems}</span>
      </td>
    </tr>`).join("")}
  </table>`;
}

// ============================================================
// เริ่มต้น
// ============================================================
loadData();
</script>
</body>
</html>
